<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <fieldset>
        <legend>Sexo</legend>
        <p>
            <input type="radio" name="sexo" id="isxmas" value="M">
            <label for="isxmas"> Masculino</label>
        </p>
        <p>
            <input type="radio" name="sexo" id="isxfem" value="F">
            <label for="isxfem"> Feminino</label>
        </p>
    </fieldset>
    <form action="cadastro.php" autocomplete="on" method="post">
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <p>
                <input type="checkbox" name="esfut" id="iesfut">
                <label for="iesfut"> Futebol</label>
            </p>
            <p>
                <input type="checkbox" name="esbas" id="iesbas">
                <label for="iesbas"> Basquete</label>
            </p>
            <p>
                <input type="checkbox" name="esgolf" id="iesgolf">
                <label for="iesgolf"> Golf</label>
            </p>
            <p>
                <input type="checkbox" name="esfreco" id="iesfresco">
                <label for="iesfresco"> Frescobol</label>
            </p>
        </fieldset>
        <input type="submit" value="Enviar">
        <input type="reset"  value="Limpar">
    </form>
</body>
</html>
